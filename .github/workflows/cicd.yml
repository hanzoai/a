# Canonical CI/CD — imports the shared hanzoai/ci reusable workflow, which reads
# the repo-root hanzo.yml (images + deploy). No per-repo build logic, no
# GitHub-hosted runners. A push to main (or a v* tag) builds ghcr.io/hanzoai/a
# and rolls it onto the `a` App CR (hanzo.yml deploy, on: [main]); PRs build but
# never deploy. Same ~7-line shape every hanzo/lux/zoo repo uses (see
# hanzoai/karma-style, hanzoai/world — peer static sites on the same
# do-sfo3-hanzo-k8s / namespace hanzo target).
name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v1
    # Target the Hanzo arc scale set by installation name — ARC scale sets match
    # by name, not the [self-hosted,linux,amd64] label triple ci@v1 defaults to.
    with:
      runner: '["hanzo-build-linux-amd64"]'
    secrets: inherit
