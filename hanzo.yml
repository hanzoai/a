# Canonical CI/CD config for hanzoai/a — read by the hanzoai/ci reusable
# workflow (.github/workflows/cicd.yml) and platform.hanzo.ai.
#
# One image: the a.hanzo.ai embed CDN — the tiny drop-in loaders (/chat,
# /analytics, /checkout), the Ask-AI bubble (/ask.js), the vendored widget
# builds (/vendor), and the snippet gallery (/) — served by ghcr.io/hanzoai/static.
# Rolled onto the `a` operator App CR (universe: infra/k8s/operator/crs/a.yaml).
#
# No `test:` block: the Dockerfile IS the gate — a broken COPY/base fails the
# image, so nothing broken ships (same pattern as karma-style + world).

images:
  - name: a
    context: .
    dockerfile: Dockerfile
    repo: ghcr.io/hanzoai/a

kms:
  path: /deploy
  environment: prod
